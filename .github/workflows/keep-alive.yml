name: Wake Render services for the working day

# Render stops a free web service after 15 minutes without inbound traffic,
# and the next request waits 53-56 seconds for it to come back.
#
# This workflow used to run every 10 minutes to prevent that. It did not.
# Scheduled workflows are best-effort, and GitHub honoured the `*/10` schedule
# roughly four times a day — gaps of three to six hours against a 15-minute
# spin-down, so both services were cold almost all the time while this
# workflow's run history showed nothing but green ticks. Measured on
# 2026-10-28: runs at 07:19, 01:28, 22:13, 18:06, 12:16 and 06:08.
#
# Holding the services awake through the day is now the API's own job, on its
# own clock (apps/api/src/common/keep-warm.service.ts). What that cannot do is
# wake a service that has already stopped overnight, because nothing is
# running to do the waking. That is all this workflow is for now: one nudge
# before the farm starts, so the first person in does not pay the cold start.
#
# Scheduled runs are still best-effort, so treat an early-morning sign-in that
# takes a minute as this workflow having run late, not as a fault.
on:
  schedule:
    # 05:17 UTC — 06:17 in Lagos, a few minutes before the working day and off
    # the hour, which is when the scheduler is most heavily loaded.
    - cron: '17 5 * * 1-5'
  workflow_dispatch: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      # Generous timeouts: a request that waits out the cold start is the
      # point. The old 30s budget gave up before a 53-56s wake-up finished.
      - name: Wake the API
        run: curl -fsS --max-time 120 https://bioassetpro-api.onrender.com/api/health -o /dev/null || true
      - name: Wake the web service
        run: curl -fsS --max-time 120 https://bioassetpro-web.onrender.com/login -o /dev/null || true
